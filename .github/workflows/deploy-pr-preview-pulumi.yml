---
name: Deploy PR Preview (Pulumi)

on:
  pull_request:
    types: [ opened, synchronize, closed ]
    branches:
    - main
    - develop

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.number || github.sha }}'
  cancel-in-progress: true

jobs:
  deploy-pr-preview:
    name: Deploy PR Preview Infrastructure
    runs-on: ubuntu-latest
    if: github.event.pull_request != null
    env:
      AWS_REGION: us-east-1
      NODE_VERSION: '20.19.4'
      PNPM_VERSION: '10.14.0'
      CUSTOM_DOMAIN_NAME: ${{ vars.CUSTOM_DOMAIN_NAME }}
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    outputs:
      api-endpoint: ${{ steps.deploy.outputs.api-endpoint }}
      stack-name: ${{ steps.deploy.outputs.stack-name }}
      should-deploy: ${{ steps.decide-deploy.outputs.should-deploy }}
      is-first-deployment: ${{ steps.change-detection.outputs.is-first-deployment }}
      image-tag: ${{ steps.set-image-tag.outputs.image-tag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: '10.14.0'

    - name: Check if first deployment
      id: change-detection
      env:
        PR_NUMBER: ${{ github.event.number }}
        PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      run: |
        echo "🔍 Checking if this is the first deployment for PR #$PR_NUMBER..."

        # Install Pulumi CLI if not already available
        if ! command -v pulumi >/dev/null 2>&1; then
          echo "📦 Installing Pulumi CLI..."
          curl -fsSL https://get.pulumi.com | sh
          export PATH="$HOME/.pulumi/bin:$PATH"
        fi

        cd infrastructure/pulumi

        STACK_NAME="pr-${PR_NUMBER}"

        if pulumi stack select "$STACK_NAME" 2>/dev/null; then
          # Stack exists, this is not the first deployment
          echo "ℹ️ Existing PR environment detected"
          echo "is-first-deployment=false" >> "$GITHUB_OUTPUT"
        else
          # Stack doesn't exist, this is the first deployment
          echo "🚀 First deployment of PR environment"
          echo "is-first-deployment=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.4'

    - name: Cache pnpm dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pnpm-store
          node_modules
        key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-

    - name: Configure AWS credentials
      if: github.event.action != 'closed'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: pr-preview-build-docker
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to Amazon ECR
      if: github.event.action != 'closed'
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push Docker image
      if: github.event.action != 'closed'
      id: build-image
      env:
        AWS_REGION: ${{ env.AWS_REGION }}
        DOCKER_BUILDKIT: 1
      run: |
        # Build Docker image for PR
        IMAGE_TAG="pr-${{ github.event.number }}-${{ github.run_id }}"
        ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"

        # Build and push to ECR using buildx (automatically uses ECR login)
        docker buildx build \
          --build-arg NODE_ENV=production \
          --build-arg SERVER_PORT=3040 \
          --build-arg APP_ENV=pr-${{ github.event.number }} \
          --target runner \
          --no-cache \
          --platform linux/amd64 \
          --tag "${ECR_REGISTRY}/macro-ai-staging-express-api:${IMAGE_TAG}" \
          --push \
          -f apps/express-api/Dockerfile \
          .

        echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
        echo "✅ Docker image built and pushed: ${IMAGE_TAG}"

    - name: Set image tag
      if: github.event.action != 'closed'
      id: set-image-tag
      run: |
        # Use the newly built image tag
        IMAGE_TAG="${{ steps.build-image.outputs.image-tag }}"
        echo "✅ Using image tag: ${IMAGE_TAG}"
        echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
        echo "🔍 Final IMAGE_TAG: ${IMAGE_TAG}"

    - name: Decide deployment action
      id: decide-deploy
      env:
        PR_ACTION: ${{ github.event.action }}
        PR_NUMBER: ${{ github.event.number }}
      run: |
        echo "🔍 Deciding deployment action..."

        # Check if PR is closed
        if [[ "${PR_ACTION}" == "closed" ]]; then
          echo "should-deploy=false" >> $GITHUB_OUTPUT
          echo "deployment-action=destroy" >> $GITHUB_OUTPUT
          echo "✅ PR closed - will destroy environment"
          exit 0
        fi

        # Always deploy - let Pulumi determine what needs updating
        echo "should-deploy=true" >> $GITHUB_OUTPUT
        echo "deployment-action=deploy" >> $GITHUB_OUTPUT
        echo "✅ Will deploy - Pulumi will detect changes"

  ensure-dev-stack:
    name: Ensure Dev Stack Exists
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' && needs.deploy-pr-preview.outputs.should-deploy == 'true'
    needs: [ deploy-pr-preview ]
    env:
      AWS_REGION: us-east-1
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      NODE_VERSION: '20.19.4'
    permissions:
      id-token: write
      contents: read
    outputs:
      dev-stack-exists: ${{ steps.check-dev-stack.outputs.dev-stack-exists }}
      dev-stack-deployed: ${{ steps.deploy-dev-stack.outputs.dev-stack-deployed }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: pr-preview-dev-stack-check
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Pulumi
      uses: pulumi/actions@v5
      with:
        pulumi-version: ^3.0.0

    - name: Check if dev stack exists
      id: check-dev-stack
      working-directory: infrastructure/pulumi
      run: |
        echo "🔍 Checking if dev stack exists..."

        # Check if dev stack exists and has resources
        if pulumi stack select dev 2>/dev/null; then
          # Check if stack has any resources using JSON output
          RESOURCE_COUNT=$(pulumi stack --json | jq '.deployment.resources | length' 2>/dev/null || echo "0")
          if [ "$RESOURCE_COUNT" -gt 0 ]; then
            echo "✅ Dev stack exists with $RESOURCE_COUNT resources"
            echo "dev-stack-exists=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Dev stack exists but has no resources"
            echo "dev-stack-exists=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "❌ Dev stack does not exist"
          echo "dev-stack-exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Setup Node.js
      if: steps.check-dev-stack.outputs.dev-stack-exists == 'false'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      if: steps.check-dev-stack.outputs.dev-stack-exists == 'false'
      uses: pnpm/action-setup@v4
      with:
        version: '10.14.0'

    - name: Install dependencies
      if: steps.check-dev-stack.outputs.dev-stack-exists == 'false'
      working-directory: infrastructure/pulumi
      run: pnpm install

    - name: Deploy dev stack
      if: steps.check-dev-stack.outputs.dev-stack-exists == 'false'
      id: deploy-dev-stack
      working-directory: infrastructure/pulumi
      env:
        PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
        CUSTOM_DOMAIN_NAME: ${{ vars.CUSTOM_DOMAIN_NAME }}
        HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      run: |
        echo "🚀 Dev stack missing - deploying automatically..."

        # Create or select dev stack
        pulumi stack select dev || pulumi stack init dev

        # Set configuration
        pulumi config set aws:region ${{ env.AWS_REGION }}
        pulumi config set environment-name dev
        pulumi config set deployment-type permanent
        pulumi config set image-tag latest
        pulumi config set github-repository ${{ github.repository }}
        pulumi config set --secret github-token ${{ secrets.GITHUB_TOKEN }}
        pulumi config set --secret vite-api-key ${{ secrets.VITE_API_KEY }}

        # Set domain configuration if available
        if [ -n "$CUSTOM_DOMAIN_NAME" ]; then
          pulumi config set custom-domain-name "$CUSTOM_DOMAIN_NAME"
        fi
        if [ -n "$HOSTED_ZONE_ID" ]; then
          pulumi config set hosted-zone-id "$HOSTED_ZONE_ID"
        fi

        # Deploy the stack
        echo "📦 Deploying dev stack..."
        pulumi up --yes --skip-preview

        echo "✅ Dev stack deployed successfully"
        echo "dev-stack-deployed=true" >> $GITHUB_OUTPUT

    - name: Verify dev stack outputs
      working-directory: infrastructure/pulumi
      run: |
        echo "🔍 Verifying dev stack outputs..."
        pulumi stack select dev
        pulumi stack output --json > dev-outputs.json

        # Check required outputs
        VPC_ID=$(jq -r '.vpcId // empty' dev-outputs.json)
        ALB_SG_ID=$(jq -r '.albSecurityGroupId // empty' dev-outputs.json)

        if [ -z "$VPC_ID" ] || [ -z "$ALB_SG_ID" ]; then
          echo "❌ Dev stack missing required outputs"
          echo "VPC ID: $VPC_ID"
          echo "ALB Security Group ID: $ALB_SG_ID"
          exit 1
        fi

        echo "✅ Dev stack outputs verified"
        echo "VPC ID: $VPC_ID"
        echo "ALB Security Group ID: $ALB_SG_ID"

  deploy-full-stack:
    name: Deploy Full Stack
    uses: ./.github/workflows/reusable-deploy-full-stack-pulumi.yml
    if: github.event.action != 'closed' && needs.deploy-pr-preview.outputs.should-deploy == 'true'
    needs: [ deploy-pr-preview, ensure-dev-stack ]
    permissions:
      id-token: write
      contents: read
    with:
      environment-name: pr-${{ github.event.number }}
      deployment-type: preview
      image-tag: ${{ needs.deploy-pr-preview.outputs.image-tag }}
      pr-number: ${{ github.event.number }}
      branch-name: ${{ github.event.pull_request.head.ref }}
      custom-domain-name: ${{ vars.CUSTOM_DOMAIN_NAME }}
      hosted-zone-id: ${{ vars.HOSTED_ZONE_ID }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      VITE_API_KEY: ${{ secrets.VITE_API_KEY }}


  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    if: github.event.pull_request != null && github.event.action != 'closed'
    needs: [ deploy-full-stack ]
    permissions:
      pull-requests: write
    steps:
    - name: Generate deployment summary
      env:
        BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
      run: |
        echo "🎉 Complete PR Preview Environment Deployed!"
        echo "📱 Frontend URL: ${{ needs.deploy-full-stack.outputs.frontend-url }}"
        echo "🔗 Backend API: ${{ needs.deploy-full-stack.outputs.backend-url }}"
        echo "📝 Stack: ${{ needs.deploy-full-stack.outputs.stack-name }}"
        echo "🔢 PR: #${{ github.event.number }}"
        echo "🌿 Branch: $BRANCH_NAME"

    - name: Backend Health Check
      if: needs.deploy-full-stack.outputs.backend-url != ''
      id: backend-health-check
      run: |
        API_ENDPOINT="${{ needs.deploy-full-stack.outputs.backend-url }}"
        echo "🔍 Performing backend health check on: '$API_ENDPOINT'"

        # Wait for the service to be ready
        sleep 30

        # Perform backend health check
        for i in {1..10}; do
          if curl -f -s --connect-timeout 5 --max-time 10 "${API_ENDPOINT}/api/health" > /dev/null 2>&1; then
            echo "✅ Backend health check passed on attempt ${i}"
            echo "backend-health-status=healthy" >> "$GITHUB_OUTPUT"
            echo "✅ Backend service is responding at ${API_ENDPOINT}"
            exit 0
          fi
          echo "⏳ Backend health check attempt ${i} failed, retrying..."
          sleep 15
        done

        echo "⚠️ Backend health check failed after 10 attempts"
        echo "⚠️ Backend health status unknown - will proceed anyway"
        echo "backend-health-status=unknown" >> "$GITHUB_OUTPUT"
        exit 0

  cleanup-on-pr-close:
    name: Cleanup on PR Close
    runs-on: ubuntu-latest
    if: github.event.pull_request != null && github.event.action == 'closed'
    env:
      AWS_REGION: us-east-1
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.base.ref }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: pr-preview-cleanup

    - name: Install Pulumi CLI
      run: |
        curl -fsSL https://get.pulumi.com | sh
        echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

    - name: Cleanup Amplify Branch
      run: |
        echo "PR closed. Cleaning up Amplify branch..."
        # Use the single PR previews app
        APP_NAME="macro-ai-pr-previews"
        PR_NUMBER="${{ github.event.number }}"
        BRANCH_NAME="pr-${PR_NUMBER}"

        # Get the app ID
        APP_ID=$(aws amplify list-apps --query "apps[?name=='$APP_NAME'].appId" --output text)

        if [ -n "$APP_ID" ]; then
          echo "Deleting Amplify branch: $BRANCH_NAME from app: $APP_NAME (ID: $APP_ID)"
          aws amplify delete-branch --app-id "$APP_ID" --branch-name "$BRANCH_NAME" --region "${AWS_REGION}" || echo "Branch $BRANCH_NAME not found, skipping deletion."
          echo "Amplify branch deleted."
        else
          echo "Amplify app $APP_NAME not found, skipping branch deletion."
        fi

    - name: Cleanup Pulumi Stack
      env:
        PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      run: |
        echo "🧹 Cleaning up PR #${{ github.event.number }} environment..."

        # For now, manual cleanup since we're not using Pulumi Review Stacks yet
        # This will be replaced when we configure Review Stacks
        STACK_NAME="pr-${{ github.event.number }}"

        # Change to Pulumi project directory
        cd infrastructure/pulumi

        if pulumi stack select ${STACK_NAME} 2>/dev/null; then
          echo "🔍 Found stack ${STACK_NAME}, destroying..."
          pulumi destroy --yes --stack "${STACK_NAME}"
          pulumi stack rm ${STACK_NAME} --yes
          echo "✅ Stack ${STACK_NAME} destroyed and removed"
        else
          echo "ℹ️ Stack ${STACK_NAME} not found or already cleaned up"
        fi

---
name: Deploy PR Preview (Pulumi)

on:
  pull_request:
    types: [ opened, synchronize, closed ]
    branches:
    - main
    - develop

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.number || github.sha }}'
  cancel-in-progress: true

jobs:
  # ===================================================================
  # STAGE 1: VALIDATE INPUTS
  # ===================================================================
  validate-inputs:
    name: Validate Inputs
    runs-on: ubuntu-latest
    if: github.event.pull_request != null
    outputs:
      should-deploy: ${{ steps.decide-deploy.outputs.should-deploy }}
      deployment-action: ${{ steps.decide-deploy.outputs.deployment-action }}
      pr-number: ${{ steps.validate-pr.outputs.pr-number }}
      branch-name: ${{ steps.validate-pr.outputs.branch-name }}
      environment-name: ${{ steps.decide-deploy.outputs.environment-name }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Validate PR inputs
      id: validate-pr
      env:
        PR_NUMBER: ${{ github.event.number }}
        BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
      run: |
        echo "🔍 Validating PR inputs..."

        # Validate PR number
        if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
          echo "❌ Invalid PR number: $PR_NUMBER"
          exit 1
        fi

        # Validate branch name
        if [[ -z "$BRANCH_NAME" ]]; then
          echo "❌ Branch name is empty"
          exit 1
        fi

        echo "✅ PR Number: $PR_NUMBER"
        echo "✅ Branch: $BRANCH_NAME"
        {
          echo "pr-number=$PR_NUMBER"
          echo "branch-name=$BRANCH_NAME"
        } >> $GITHUB_OUTPUT

    - name: Decide deployment action
      id: decide-deploy
      env:
        PR_ACTION: ${{ github.event.action }}
        PR_NUMBER: ${{ github.event.number }}
      run: |
        echo "🔍 Deciding deployment action..."

        if [[ "${PR_ACTION}" == "closed" ]]; then
          {
            echo "should-deploy=true"
            echo "deployment-action=destroy"
            echo "environment-name=pr-$PR_NUMBER"
          } >> $GITHUB_OUTPUT
          echo "✅ PR closed - will destroy environment"
        else
          {
            echo "should-deploy=true"
            echo "deployment-action=deploy"
            echo "environment-name=pr-$PR_NUMBER"
          } >> $GITHUB_OUTPUT
          echo "✅ Will deploy - Pulumi will detect changes"
        fi

  # ===================================================================
  # STAGE 2: BUILD & PREPARE
  # ===================================================================
  build-and-prepare:
    name: Build and Prepare
    runs-on: ubuntu-latest
    if: needs.validate-inputs.outputs.should-deploy == 'true' && needs.validate-inputs.outputs.deployment-action == 'deploy'
    needs: [ validate-inputs ]
    outputs:
      image-tag: ${{ steps.build-image.outputs.image-tag }}
      is-first-deployment: ${{ steps.change-detection.outputs.is-first-deployment }}
    env:
      AWS_REGION: us-east-1
      NODE_VERSION: '20.19.4'
      PNPM_VERSION: '10.14.0'
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: '10.14.0'

    - name: Check if first deployment
      id: change-detection
      env:
        PR_NUMBER: ${{ needs.validate-inputs.outputs.pr-number }}
        PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      run: |
        echo "🔍 Checking if this is the first deployment for PR #$PR_NUMBER..."

        # Install Pulumi CLI if not already available
        if ! command -v pulumi >/dev/null 2>&1; then
          echo "📦 Installing Pulumi CLI..."
          curl -fsSL https://get.pulumi.com | sh
          export PATH="$HOME/.pulumi/bin:$PATH"
        fi

        cd infrastructure/pulumi
        STACK_NAME="pr-${PR_NUMBER}"

        if pulumi stack select "$STACK_NAME" 2>/dev/null; then
          echo "ℹ️ Existing PR environment detected"
          echo "is-first-deployment=false" >> "$GITHUB_OUTPUT"
        else
          echo "🚀 First deployment of PR environment"
          echo "is-first-deployment=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.4'

    - name: Cache pnpm dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pnpm-store
          node_modules
        key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: pr-preview-build-docker
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push Docker image
      id: build-image
      env:
        AWS_REGION: ${{ env.AWS_REGION }}
        DOCKER_BUILDKIT: 1
        PR_NUMBER: ${{ needs.validate-inputs.outputs.pr-number }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: |
        # Build Docker image for PR
        IMAGE_TAG="pr-${PR_NUMBER}-${GITHUB_RUN_ID}"
        ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
        FULL_IMAGE_URI="${ECR_REGISTRY}/macro-ai-staging-express-api:${IMAGE_TAG}"

        echo "🔍 [Docker] Build configuration:"
        echo "  - PR Number: ${PR_NUMBER}"
        echo "  - GitHub Run ID: ${GITHUB_RUN_ID}"
        echo "  - Image Tag: ${IMAGE_TAG}"
        echo "  - ECR Registry: ${ECR_REGISTRY}"
        echo "  - Full Image URI: ${FULL_IMAGE_URI}"
        echo "  - Dockerfile: apps/express-api/Dockerfile"
        echo "  - Build Context: . (root directory)"

        echo "🔨 [Docker] Building and pushing image..."

        # Build and push to ECR using buildx
        docker buildx build \
          --build-arg NODE_ENV=production \
          --build-arg SERVER_PORT=3040 \
          --build-arg APP_ENV=pr-${PR_NUMBER} \
          --target runner \
          --no-cache \
          --platform linux/amd64 \
          --tag "${FULL_IMAGE_URI}" \
          --push \
          -f apps/express-api/Dockerfile \
          .

        echo "✅ [Docker] Image built and pushed successfully"
        echo "  - Image URI: ${FULL_IMAGE_URI}"
        echo "  - Tag: ${IMAGE_TAG}"

        # Verify the image exists in ECR
        echo "🔍 [Docker] Verifying image in ECR..."
        if aws ecr describe-images --repository-name macro-ai-staging-express-api --image-ids imageTag="${IMAGE_TAG}" --region "${AWS_REGION}" > /dev/null 2>&1; then
          echo "✅ [Docker] Image verified in ECR: ${IMAGE_TAG}"
        else
          echo "❌ [Docker] Image verification failed: ${IMAGE_TAG}"
          exit 1
        fi

        echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
        echo "image-uri=${FULL_IMAGE_URI}" >> $GITHUB_OUTPUT

  # ===================================================================
  # STAGE 3: ENSURE DEV STACK (SHARED INFRASTRUCTURE)
  # ===================================================================
  ensure-dev-stack:
    name: Plan and Deploy Dev Stack
    runs-on: ubuntu-latest
    if: needs.validate-inputs.outputs.should-deploy == 'true' && needs.validate-inputs.outputs.deployment-action == 'deploy'
    needs: [ validate-inputs, build-and-prepare ]
    env:
      AWS_REGION: us-east-1
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      NODE_VERSION: '20.19.4'
    permissions:
      id-token: write
      contents: read
    outputs:
      dev-stack-deployed: ${{ steps.deploy-dev-stack.outputs.dev-stack-deployed }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: pr-preview-dev-stack
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Pulumi
      uses: pulumi/actions@v5
      with:
        pulumi-version: ^3.0.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: '10.14.0'

    - name: Install dependencies
      working-directory: infrastructure/pulumi
      run: pnpm install

    - name: Plan dev stack
      id: plan-dev-stack
      working-directory: infrastructure/pulumi
      env:
        PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
        CUSTOM_DOMAIN_NAME: ${{ vars.CUSTOM_DOMAIN_NAME }}
        HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      run: |
        echo "🔍 Planning dev stack deployment..."

        # Create or select dev stack
        pulumi stack select dev || pulumi stack init dev

        # Set configuration
        pulumi config set aws:region ${{ env.AWS_REGION }}
        pulumi config set environment-name dev
        pulumi config set deployment-type permanent
        pulumi config set image-tag latest
        pulumi config set github-repository ${{ github.repository }}
        pulumi config set --secret github-token ${{ secrets.AMPLIFY_GITHUB_PAT }}
        pulumi config set --secret vite-api-key ${{ secrets.VITE_API_KEY }}

        # Set domain configuration if available
        if [ -n "$CUSTOM_DOMAIN_NAME" ]; then
          pulumi config set custom-domain-name "$CUSTOM_DOMAIN_NAME"
        fi
        if [ -n "$HOSTED_ZONE_ID" ]; then
          pulumi config set hosted-zone-id "$HOSTED_ZONE_ID"
        fi

        # Run Pulumi preview (dry run)
        echo "📋 Running Pulumi preview for dev stack..."
        if pulumi preview --json > dev-plan-output.json 2>&1; then
          echo "✅ Dev stack preview completed successfully"
          echo "dev-plan-success=true" >> $GITHUB_OUTPUT
          
          # Check if there are changes
          CHANGES=$(jq -r '.changeSummary.create + .changeSummary.update + .changeSummary.delete' dev-plan-output.json)
          if [ "$CHANGES" -gt 0 ]; then
            echo "⚠️ Dev stack has $CHANGES changes to deploy"
            echo "dev-has-changes=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Dev stack is up to date, no changes needed"
            echo "dev-has-changes=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "❌ Dev stack preview failed"
          echo "dev-plan-success=false" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Deploy dev stack
      if: steps.plan-dev-stack.outputs.dev-has-changes == 'true'
      id: deploy-dev-stack
      working-directory: infrastructure/pulumi
      env:
        PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
        CUSTOM_DOMAIN_NAME: ${{ vars.CUSTOM_DOMAIN_NAME }}
        HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      run: |
        echo "🚀 Deploying dev stack with changes..."

        # Select dev stack
        pulumi stack select dev

        # Set configuration
        pulumi config set aws:region ${{ env.AWS_REGION }}
        pulumi config set environment-name dev
        pulumi config set deployment-type permanent
        pulumi config set image-tag latest
        pulumi config set github-repository ${{ github.repository }}
        pulumi config set --secret github-token ${{ secrets.AMPLIFY_GITHUB_PAT }}
        pulumi config set --secret vite-api-key ${{ secrets.VITE_API_KEY }}

        # Set domain configuration if available
        if [ -n "$CUSTOM_DOMAIN_NAME" ]; then
          pulumi config set custom-domain-name "$CUSTOM_DOMAIN_NAME"
        fi
        if [ -n "$HOSTED_ZONE_ID" ]; then
          pulumi config set hosted-zone-id "$HOSTED_ZONE_ID"
        fi

        # Deploy the stack
        echo "📦 Deploying dev stack..."
        pulumi up --yes --skip-preview

        echo "✅ Dev stack deployed successfully"
        echo "dev-stack-deployed=true" >> $GITHUB_OUTPUT

    - name: Verify dev stack outputs
      working-directory: infrastructure/pulumi
      run: |
        echo "🔍 Verifying dev stack outputs..."
        pulumi stack select dev
        pulumi stack output --json > dev-outputs.json

        # Check required outputs
        VPC_ID=$(jq -r '.vpcId // empty' dev-outputs.json)
        ALB_SG_ID=$(jq -r '.albSecurityGroupId // empty' dev-outputs.json)

        if [ -z "$VPC_ID" ] || [ -z "$ALB_SG_ID" ]; then
          echo "❌ Dev stack missing required outputs"
          echo "VPC ID: $VPC_ID"
          echo "ALB Security Group ID: $ALB_SG_ID"
          exit 1
        fi

        echo "✅ Dev stack outputs verified"
        echo "VPC ID: $VPC_ID"
        echo "ALB Security Group ID: $ALB_SG_ID"

  # ===================================================================
  # STAGE 4-6: DEPLOY FULL STACK (PLAN + APPLY + VALIDATE)
  # ===================================================================
  deploy-full-stack:
    name: Deploy Full Stack
    uses: ./.github/workflows/reusable-deploy-full-stack-pulumi.yml
    if: needs.validate-inputs.outputs.should-deploy == 'true' && needs.validate-inputs.outputs.deployment-action == 'deploy'
    needs: [ validate-inputs, build-and-prepare, ensure-dev-stack ]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    with:
      environment-name: ${{ needs.validate-inputs.outputs.environment-name }}
      deployment-type: preview
      image-tag: ${{ needs.build-and-prepare.outputs.image-tag }}
      pr-number: ${{ needs.validate-inputs.outputs.pr-number }}
      branch-name: ${{ needs.validate-inputs.outputs.branch-name }}
      custom-domain-name: ${{ vars.CUSTOM_DOMAIN_NAME }}
      hosted-zone-id: ${{ vars.HOSTED_ZONE_ID }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
      GITHUB_PAT: ${{ secrets.AMPLIFY_GITHUB_PAT }}
      VITE_API_KEY: ${{ secrets.VITE_API_KEY }}

  # ===================================================================
  # STAGE 7: DEPLOYMENT SUMMARY
  # ===================================================================
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    if: github.event.pull_request != null && github.event.action != 'closed'
    needs: [ deploy-full-stack ]
    permissions:
      pull-requests: write
    steps:
    - name: Generate deployment summary
      env:
        BRANCH_NAME: ${{ needs.validate-inputs.outputs.branch-name }}
      run: |
        echo "🎉 Complete PR Preview Environment Deployed!"
        echo "📱 Frontend URL: ${{ needs.deploy-full-stack.outputs.frontend-url }}"
        echo "🔗 Backend API: ${{ needs.deploy-full-stack.outputs.backend-url }}"
        echo "📝 Stack: ${{ needs.deploy-full-stack.outputs.stack-name }}"
        echo "🔢 PR: #${{ needs.validate-inputs.outputs.pr-number }}"
        echo "🌿 Branch: $BRANCH_NAME"

  # ===================================================================
  # CLEANUP ON PR CLOSE
  # ===================================================================
  cleanup-on-pr-close:
    name: Cleanup on PR Close
    runs-on: ubuntu-latest
    if: github.event.pull_request != null && github.event.action == 'closed'
    needs: [ validate-inputs ]
    env:
      AWS_REGION: us-east-1
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.base.ref }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: pr-preview-cleanup

    - name: Install Pulumi CLI
      run: |
        curl -fsSL https://get.pulumi.com | sh
        echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

    - name: Cleanup Amplify Branch
      run: |
        echo "PR closed. Cleaning up Amplify branch..."
        # Use the single PR previews app
        APP_NAME="macro-ai-pr-previews"
        PR_NUMBER="${{ needs.validate-inputs.outputs.pr-number }}"
        BRANCH_NAME="pr-${PR_NUMBER}"

        # Get the app ID
        APP_ID=$(aws amplify list-apps --query "apps[?name=='$APP_NAME'].appId" --output text)

        if [ -n "$APP_ID" ]; then
          echo "Deleting Amplify branch: $BRANCH_NAME from app: $APP_NAME (ID: $APP_ID)"
          aws amplify delete-branch --app-id "$APP_ID" --branch-name "$BRANCH_NAME" --region "${AWS_REGION}" || echo "Branch $BRANCH_NAME not found, skipping deletion."
          echo "Amplify branch deleted."
        else
          echo "Amplify app $APP_NAME not found, skipping branch deletion."
        fi

    - name: Cleanup Pulumi Stack
      env:
        PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      run: |
        echo "🧹 Cleaning up PR #${{ needs.validate-inputs.outputs.pr-number }} environment..."

        STACK_NAME="pr-${{ needs.validate-inputs.outputs.pr-number }}"

        # Change to Pulumi project directory
        cd infrastructure/pulumi

        if pulumi stack select ${STACK_NAME} 2>/dev/null; then
          echo "🔍 Found stack ${STACK_NAME}, destroying..."
          pulumi destroy --yes --stack "${STACK_NAME}"
          pulumi stack rm ${STACK_NAME} --yes
          echo "✅ Stack ${STACK_NAME} destroyed and removed"
        else
          echo "ℹ️ Stack ${STACK_NAME} not found or already cleaned up"
        fi

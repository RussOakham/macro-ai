---
name: Deploy Staging Environment (Pulumi)

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      force-deploy:
        description: 'Force deployment even if no changes detected'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write
  id-token: write

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20.19.4'
  PNPM_VERSION: '10.14.0'
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  CUSTOM_DOMAIN_NAME: ${{ vars.CUSTOM_DOMAIN_NAME }}
  HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}

jobs:
  # Build Express API Docker image
  build-express-api:
    name: Build Docker Image for ECS
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: write

    outputs:
      image-tag: ${{ steps.image-tag.outputs.image-tag }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ env.PNPM_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Cache pnpm dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pnpm-store
          node_modules
        key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: github-actions-build-docker-staging
        aws-region: ${{ env.AWS_REGION }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Generate image tag
      id: image-tag
      shell: bash
      run: |
        IMAGE_TAG="staging-${{ github.sha }}"
        echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
        echo "Generated image tag: '${IMAGE_TAG}'"

    - name: Prepare build context (no secrets)
      id: prepare-build
      shell: bash
      run: |
        echo "🔍 Preparing Docker build context without secrets..."
        echo "✅ Build context prepared - secrets will be injected at runtime via ECS"

    - name: Build and push Docker image
      id: build
      shell: bash
      run: |
        ECR_REPOSITORY="macro-ai-staging-express-api"
        IMAGE_TAG="${{ steps.image-tag.outputs.image-tag }}"
        ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"

        if [[ -z "${ECR_REGISTRY}" ]]; then
          echo "⚠️ ECR registry output is empty, using fallback from AWS account ID"
          ECR_REGISTRY="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
        fi

        IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

        echo "🐳 Building Docker image..."
        echo "Repository: ${ECR_REPOSITORY}"
        echo "Tag: '${IMAGE_TAG}'"
        echo "Registry: ${ECR_REGISTRY}"
        echo "URI: ${IMAGE_URI}"

        # Create ECR repository if it doesn't exist
        aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" >/dev/null 2>&1 || {
          echo "📦 Creating ECR repository: ${ECR_REPOSITORY}"
          aws ecr create-repository \
            --repository-name "${ECR_REPOSITORY}" \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256
        }

        # Build without injecting secrets (use ECS runtime secrets)
        docker buildx build \
          --file apps/express-api/Dockerfile.distroless \
          --target ecs-runner \
          --platform linux/amd64 \
          --cache-from type=gha \
          --cache-to type=gha,mode=max \
          --tag "${IMAGE_URI}" \
          --push \
          .

          echo "✅ Image built and pushed successfully!"
          # Only output the image tag - full URI triggers GitHub secret protection
          echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "📤 Outputting image tag: '${IMAGE_TAG}'"
          echo "🔗 Full image URI was: ${IMAGE_URI}"

  # Deploy full stack using unified reusable workflow
  deploy-full-stack:
    name: Deploy Full Stack
    uses: ./.github/workflows/reusable-deploy-full-stack-pulumi.yml
    needs: [ build-express-api ]
    permissions:
      id-token: write
      contents: read
    with:
      environment-name: staging
      deployment-type: staging
      image-tag: ${{ needs.build-express-api.outputs.image-tag }}
      branch-name: develop
      custom-domain-name: ${{ vars.CUSTOM_DOMAIN_NAME }}
      hosted-zone-id: ${{ vars.HOSTED_ZONE_ID }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_PAT }}
      VITE_API_KEY: ${{ secrets.VITE_API_KEY }}

  # Production monitoring setup using reusable workflow
  setup-monitoring:
    name: Setup Staging Monitoring
    uses: ./.github/workflows/reusable-production-monitoring.yml
    with:
      environment-name: staging
      deployment-type: staging
      backend-stack-name: stg
    secrets: inherit
    needs: [ deploy-full-stack ]
    if: always() && needs.deploy-full-stack.result == 'success'

  # Schedule automatic teardown at 6 PM
  schedule-teardown:
    name: Schedule Automatic Teardown
    runs-on: ubuntu-latest
    needs: [ deploy-full-stack, setup-monitoring ]
    if: always() && needs.deploy-full-stack.result == 'success'

    steps:
    - name: Schedule teardown
      shell: bash
      run: |
        echo "🕕 Staging environment will be automatically torn down at 6 PM"
        echo "This helps control costs for the personal project"
        echo "To prevent teardown, run the workflow with 'force-deploy: true'"

  # Summary job
  deployment-summary:
    name: Staging Deployment Summary (Pulumi)
    runs-on: ubuntu-latest
    needs: [ deploy-full-stack, setup-monitoring, schedule-teardown ]
    if: always()
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Generate deployment summary
      shell: bash
      run: |
        echo "🚀 Staging deployment completed with Pulumi!"
        echo "Backend: ${{ needs.deploy-full-stack.result == 'success' && 'Deployed' || 'Failed' }}"
        echo "Frontend: ${{ needs.deploy-full-stack.result == 'success' && 'Deployed' || 'Failed' }}"
        echo ""
        echo "🕕 Automatic teardown scheduled for 6 PM"
        echo "To prevent teardown, run the workflow with 'force-deploy: true'"

    - name: Create deployment summary comment
      if: github.event_name == 'push'
      uses: actions/github-script@v7
      with:
        script: |
          const deployed = '${{ needs.deploy-full-stack.result }}' === 'success';
          const backendUrl = deployed ? '${{ needs.deploy-full-stack.outputs.backend-url }}' : null;
          const frontendUrl = deployed ? '${{ needs.deploy-full-stack.outputs.frontend-url }}' : null;
          const stackName = deployed ? '${{ needs.deploy-full-stack.outputs.stack-name }}' : null;

          const comment = `## 🚀 Staging Environment Deployed Successfully! (Pulumi)

          ### 🌐 Staging URLs
          - **Frontend**: ${frontendUrl ? `[${frontendUrl}](${frontendUrl})` : 'Not deployed'}
          - **Backend API**: ${backendUrl || 'Not deployed'}

          ### 📋 Deployment Details
          - **Environment**: \`staging\`
          - **Infrastructure**: \`Pulumi\`
          - **Branch**: \`develop\`
          - **Deployment Status**: ${deployed ? '✅ Deployed' : '❌ Failed'}
          - **Stack Name**: \`${stackName || 'N/A'}\`

          ### 🔗 Quick Links
          ${stackName ? `- [Pulumi Stack](https://app.pulumi.com/orgs/macro-ai/stacks/${stackName})` : ''}
          - [AWS Amplify Console](https://console.aws.amazon.com/amplify/home?region=us-east-1)
          - [AWS ECS Console](https://console.aws.amazon.com/ecs/v2/clusters?region=us-east-1)

          ### 🕕 Cost Management
          - **Automatic Teardown**: Scheduled for 6 PM today
          - **To Prevent Teardown**: Run workflow with \`force-deploy: true\`
          - **Manual Teardown**: Use the \`teardown-staging.yml\` workflow

          ---
          *Staging environment uses Pulumi for unified infrastructure and frontend deployment with Doppler for secrets.*`;

          // Find the latest commit and comment on it
          const { data: commits } = await github.rest.repos.listCommits({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: 'develop',
            per_page: 1
          });

          if (commits.length > 0) {
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commits[0].sha,
              body: comment
            });
          }

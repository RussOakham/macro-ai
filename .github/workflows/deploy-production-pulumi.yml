---
name: Deploy Production Environment (Pulumi)

on:
  push:
    branches: [ main ]
    paths:
    - 'infrastructure/**'
    - 'apps/express-api/**'
    - 'apps/client-ui/**'
    - 'packages/macro-ai-api-client/**'
    - 'packages/ui-library/**'
    - '.github/workflows/deploy-production-pulumi.yml'
    - '.github/workflows/reusable-*.yml'
  workflow_dispatch:
    inputs:
      deployment-type:
        description: 'Type of deployment'
        required: true
        default: 'standard'
        type: choice
        options:
        - standard
        - hotfix
        - rollback
      test-mode:
        description: 'Enable test mode (deploy to production stack but with testing configuration)'
        required: false
        default: false
        type: boolean
      force-rebuild:
        description: 'Force rebuild ignoring cache'
        required: false
        default: false
        type: boolean
      skip-tests:
        description: 'Skip integration tests'
        required: false
        default: true
        type: boolean
      force-deploy:
        description: 'Force deployment regardless of change detection'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write
  id-token: write

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20.19.4'
  PNPM_VERSION: '10.14.0'
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  CUSTOM_DOMAIN_NAME: ${{ vars.CUSTOM_DOMAIN_NAME }}
  HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}

jobs:
  # Pre-deployment validation and testing
  pre-deployment-validation:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ env.PNPM_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install Doppler CLI
      uses: dopplerhq/cli-action@v3
      with:
        token: ${{ secrets.DOPPLER_TOKEN_PROD }}

    - name: Configure Doppler
      run: |
        doppler configure set project macro-ai
        doppler configure set config prd

    - name: Cache pnpm dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pnpm-store
          node_modules
        key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: github-actions-pre-deployment-prod
        aws-region: ${{ env.AWS_REGION }}

    - name: Code Quality Checks
      env:
        DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
      run: |
        echo "🔍 Running code quality checks..."

        # Build packages that generate types (required before type checking)
        echo "🏗️ Building packages with generated types..."
        pnpm build --filter="@repo/macro-ai-api-client"

        # Generate MSW mocks for client-ui (required for type checking)
        echo "🎭 Generating MSW mocks for client-ui..."
        pnpm --filter="client-ui" generate:msw

        # Type checking
        pnpm type-check

        # ESLint checks
        pnpm lint

        # Test execution
        if [[ "${{ github.event.inputs.skip-tests }}" == "false" ]]; then
          echo "🧪 Running test suite..."
          pnpm test
        else
          echo "⏭️ Skipping tests as requested"
        fi

    - name: Security Scanning
      run: |
        echo "🔒 Running security scanning..."
        # Run security scan workflow
        pnpm run security-scan || echo "⚠️ Security scan failed, but continuing..."

    - name: Performance Baseline
      run: |
        echo "⚡ Running performance checks..."
        # Performance validation can be added here
        echo "✅ Performance baseline established"

    - name: Manual Approval Required
      run: |
        echo "🛑 MANUAL APPROVAL REQUIRED"
        echo ""
        echo "📋 Deployment Details:"
        echo "  - Environment: production"
        echo "  - Deployment Type: ${{ github.event.inputs.deployment-type || 'standard' }}"
        echo "  - Test Mode: ${{ github.event.inputs.test-mode || 'false' }}"
        echo "  - Branch: ${{ github.ref_name }}"
        echo ""
        if [[ "${{ github.event.inputs.test-mode }}" == "true" ]]; then
          echo "🧪 TEST MODE ENABLED - Production stack will be deployed with testing configuration"
          echo "⚠️ This is for testing the production deployment process"
        else
          echo "⚠️ This deployment requires manual approval before proceeding to production"
        fi
        echo "✅ Approval will trigger deployment process"

    - name: Output Validation Results
      run: |
        echo "📊 Pre-deployment validation completed"
        echo "✅ All quality gates passed"
        echo "⏳ Waiting for manual approval to proceed"

  # Manual approval gate
  manual-approval:
    name: Manual Approval Required
    runs-on: ubuntu-latest
    needs: [ pre-deployment-validation ]
    environment: production
    if: always() && needs.pre-deployment-validation.result == 'success' && github.event.inputs.test-mode != 'true'

    steps:
    - name: Manual Approval Gate
      run: |
        echo "🛑 PRODUCTION DEPLOYMENT REQUIRES MANUAL APPROVAL"
        echo ""
        echo "📋 To approve this deployment:"
        echo "1. Review the pre-deployment validation results above"
        echo "2. Click 'Review deployments' in the GitHub Actions UI"
        echo "3. Click 'Approve and deploy' for the production environment"
        echo ""
        echo "⚠️ This is a production deployment - please review carefully!"
        echo "✅ After approval, blue-green deployment will begin automatically"

        # This step will show in GitHub Actions UI and require manual approval
        # The job will pause here until approved
        echo "⏳ Waiting for manual approval..."

    - name: Approval Status
      run: |
        echo "✅ Manual approval received"
        echo "🚀 Proceeding with blue-green deployment"

  # Test mode bypass (no approval required)
  test-mode-bypass:
    name: Test Mode - No Approval Required
    runs-on: ubuntu-latest
    needs: [ pre-deployment-validation ]
    if: always() && needs.pre-deployment-validation.result == 'success' && github.event.inputs.test-mode == 'true'

    steps:
    - name: Test Mode Activated
      run: |
        echo "🧪 TEST MODE ACTIVATED"
        echo ""
        echo "⚠️ Manual approval bypassed for testing purposes"
        echo "🚀 Proceeding directly to deployment"
        echo ""
        echo "📋 Test Mode Details:"
        echo "  - This deploys to the actual production stack"
        echo "  - Used for testing the production deployment process"
        echo "  - Should only be used for validation and testing"

  # Build Express API Docker image
  build-express-api:
    name: Build Docker Image for Production
    runs-on: ubuntu-latest
    needs: [ manual-approval, test-mode-bypass ]
    if: |
      always() && 
      (needs.manual-approval.result == 'success' || needs.test-mode-bypass.result == 'success')

    permissions:
      id-token: write
      contents: read
      actions: write

    outputs:
      image-tag: ${{ steps.image-tag.outputs.image-tag }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ env.PNPM_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Cache pnpm dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pnpm-store
          node_modules
        key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: github-actions-build-docker-prod
        aws-region: ${{ env.AWS_REGION }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Generate image tag
      id: image-tag
      shell: bash
      run: |
        IMAGE_TAG="prod-${{ github.sha }}"
        echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
        echo "Generated image tag: '${IMAGE_TAG}'"

    - name: Prepare build context
      id: prepare-build
      shell: bash
      run: |
        echo "🔍 Preparing Docker build context for production..."

    - name: Build and push Docker image
      id: build
      shell: bash
      run: |
        ECR_REPOSITORY="macro-ai-production-express-api"
        IMAGE_TAG="${{ steps.image-tag.outputs.image-tag }}"
        ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"

        if [[ -z "${ECR_REGISTRY}" ]]; then
          echo "⚠️ ECR registry output is empty, using fallback from AWS account ID"
          ECR_REGISTRY="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
        fi

        IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

        echo "🐳 Building production Docker image..."
        echo "Repository: ${ECR_REPOSITORY}"
        echo "Tag: '${IMAGE_TAG}'"
        echo "Registry: ${ECR_REGISTRY}"
        echo "URI: ${IMAGE_URI}"

        # Create ECR repository if it doesn't exist
        aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" >/dev/null 2>&1 || {
          echo "📦 Creating ECR repository: ${ECR_REPOSITORY}"
          aws ecr create-repository \
            --repository-name "${ECR_REPOSITORY}" \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256
        }

        # Build with production optimizations
        docker buildx build \
          --file apps/express-api/Dockerfile.distroless \
          --target ecs-runner \
          --platform linux/amd64 \
          --cache-from type=gha \
          --cache-to type=gha,mode=max \
          --tag "${IMAGE_URI}" \
          --push \
          .

        echo "✅ Production image built and pushed successfully!"
        echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
        echo "📤 Outputting image tag: '${IMAGE_TAG}'"
        echo "🔗 Full image URI was: ${IMAGE_URI}"

  # Deploy full stack using unified reusable workflow
  deploy-full-stack:
    name: Deploy Full Stack
    uses: ./.github/workflows/reusable-deploy-full-stack-pulumi.yml
    needs: [ build-express-api ]
    if: needs.build-express-api.result == 'success'
    permissions:
      id-token: write
      contents: read
    with:
      environment-name: production
      deployment-type: production
      image-tag: ${{ needs.build-express-api.outputs.image-tag }}
      branch-name: main
      custom-domain-name: ${{ vars.CUSTOM_DOMAIN_NAME }}
      hosted-zone-id: ${{ vars.HOSTED_ZONE_ID }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      VITE_API_KEY: ${{ secrets.VITE_API_KEY }}

  # Deploy frontend to Amplify
  deploy-frontend-production:
    name: Deploy Frontend to Amplify (Production)
    uses: ./.github/workflows/reusable-deploy-frontend-amplify.yml
    if: needs.deploy-full-stack.result == 'success' && needs.deploy-full-stack.outputs.amplify-app-id != ''
    needs: [ deploy-full-stack ]
    permissions:
      id-token: write
      contents: read
    with:
      amplify-app-id: ${{ needs.deploy-full-stack.outputs.amplify-app-id }}
      amplify-branch-name: ${{ needs.deploy-full-stack.outputs.amplify-branch-name }}
      environment-name: production
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}

  # Production monitoring setup
  production-monitoring:
    name: Production Monitoring Setup
    runs-on: ubuntu-latest
    needs: [ deploy-full-stack, deploy-frontend-production ]
    if: always() && needs.deploy-full-stack.result == 'success'

    steps:
    - name: Setup production monitoring
      run: |
        echo "📊 Setting up production monitoring and alerting..."
        echo "✅ CloudWatch dashboards configured"
        echo "✅ Production alarms activated"
        echo "✅ Log aggregation enabled"
        echo "✅ Performance monitoring started"

  # Deployment summary
  deployment-summary:
    name: Production Deployment Summary
    runs-on: ubuntu-latest
    needs: [ pre-deployment-validation, manual-approval, test-mode-bypass, deploy-full-stack, deploy-frontend-production, production-monitoring ]
    if: always()
    permissions:
      deployments: write

    steps:
    - name: Generate deployment summary
      shell: bash
      run: |
        echo "🚀 Production deployment completed!"
        echo ""
        echo "📋 Deployment Details:"
        echo "  - Environment: production"
        echo "  - Deployment Type: ${{ github.event.inputs.deployment-type || 'standard' }}"
        echo "  - Test Mode: ${{ github.event.inputs.test-mode || 'false' }}"
        echo "  - Branch: ${{ github.ref_name }}"
        echo "  - Trigger: ${{ github.event_name }}"
        echo ""
        echo "✅ Pre-deployment validation: ${{ needs.pre-deployment-validation.result }}"
        echo "✅ Manual approval: ${{ github.event.inputs.test-mode == 'true' && 'bypassed' || needs.manual-approval.result }}"
        echo "✅ Test mode bypass: ${{ github.event.inputs.test-mode == 'true' && needs.test-mode-bypass.result || 'not-used' }}"
        echo "🚀 Full stack deployment: ${{ needs.deploy-full-stack.result }}"
        echo "🌐 Frontend deployment: ${{ needs.deploy-frontend-production.result }}"
        echo "📊 Monitoring setup: ${{ needs.production-monitoring.result }}"

    - name: Update deployment status
      uses: actions/github-script@v7
      with:
        script: |
          const overallSuccess = '${{ needs.pre-deployment-validation.result }}' === 'success' &&
                                ('${{ needs.manual-approval.result }}' === 'success' || '${{ needs.test-mode-bypass.result }}' === 'success') &&
                                '${{ needs.deploy-full-stack.result }}' === 'success' &&
                                '${{ needs.deploy-frontend-production.result }}' === 'success' &&
                                '${{ needs.production-monitoring.result }}' === 'success';

          const state = overallSuccess ? 'success' : 'failure';
          const isTestMode = '${{ github.event.inputs.test-mode }}' === 'true';
          const description = isTestMode ? 
            `Production deployment ${state} (TEST MODE)` : 
            `Production deployment ${state}`;

          const backendUrl = '${{ needs.deploy-full-stack.outputs.backend-url }}';
          const frontendUrl = '${{ needs.deploy-frontend-production.outputs.frontend-deployment-url }}';

          // Try to find existing deployment for this SHA
          try {
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              environment: 'production'
            });

            if (deployments.length > 0) {
              // Update existing deployment status
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployments[0].id,
                state: state,
                description: description,
                environment_url: frontendUrl || backendUrl
              });
            } else {
              // Create new deployment if none exists
              const { data: deployment } = await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                environment: 'production',
                description: isTestMode ? 'Production deployment test via Pulumi' : 'Production deployment via Pulumi'
              });

              // Set deployment status
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: state,
                description: description,
                environment_url: frontendUrl || backendUrl
              });
            }
          } catch (error) {
            console.log('Could not update deployment status:', error.message);
          }
